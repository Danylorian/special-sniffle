name: Build Android APK

on:
  push:
    branches:
      - claude/expense-management-app-dad82f
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install web app dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web app
        working-directory: mobile
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk caisse-familiale.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: caisse-familiale-apk
          path: caisse-familiale.apk
          retention-days: 90

      - name: Publish APK to a rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Caisse Familiale — dernière version APK"
          body: |
            APK généré automatiquement à partir du commit ${{ github.sha }}.

            Pour installer : télécharge `caisse-familiale.apk` sur le téléphone,
            ouvre le fichier, et autorise l'installation depuis une source
            inconnue si demandé.
          files: caisse-familiale.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
